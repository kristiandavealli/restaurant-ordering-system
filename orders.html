<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | Maison Restaurant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="orders.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <span class="logo-mark">M</span>
            <div>
                <h2>MAISON</h2>
                <small>RESTAURANT</small>
            </div>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="orders.html">My Orders</a>
        </nav>
        <div class="nav-actions">
            <a href="cart.html" class="cart-link">Cart</a>
            <a href="login.html" class="login-btn">Login</a>
        </div>
    </header>
    <main class="orders-page">
        <section class="orders-heading">
            <p class="eyebrow">ORDER HISTORY</p>
            <h1>My Orders</h1>
            <p>Track and review your previous restaurant orders.</p>
        </section>
        <section class="orders-container">
            <div class="orders-topbar">
                <h2>Recent Orders</h2>
                <select id="order-filter">
                    <option value="all">All Orders</option>
                    <option value="completed">Completed</option>
                    <option value="preparing">Preparing</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <div id="orders-container"></div>
        </section>
    </main>
    <footer class="footer">
        <div class="footer-brand">
            <h2>MAISON</h2>
            <p>Made with passion. Served with love.</p>
        </div>
        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="orders.html">Orders</a>
            <a href="login.html">Login</a>
        </div>
        <p class="copyright">
            © 2026 Maison Restaurant. All rights reserved.
        </p>
    </footer>
    <script src="orders.js"></script>
</body>
</html>
